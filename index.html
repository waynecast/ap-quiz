<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>A&amp;P Quiz Practice</title>
<meta name="description" content="NYIM A&P practice quizzes: a new random set every time, by quiz, by subject, or cumulative for the midterm and final.">
<meta name="theme-color" content="#0f766e">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="A&amp;P Quiz">
<style>
:root{
  --bg:#f6f7f5; --card:#ffffff; --ink:#1c2321; --muted:#5f6b67; --line:#dfe4e1;
  --accent:#0f766e; --accent-ink:#ffffff; --accent-soft:#e3f2ef;
  --ok:#15803d; --ok-soft:#e5f5ea; --bad:#b91c1c; --bad-soft:#fbe9e9;
  --radius:14px;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#111615; --card:#1a2120; --ink:#e8eeec; --muted:#9aa7a3; --line:#2c3633;
    --accent:#2dd4bf; --accent-ink:#06201d; --accent-soft:#163430;
    --ok:#4ade80; --ok-soft:#14301f; --bad:#f87171; --bad-soft:#3a1b1b;
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--bg); color:var(--ink);
  font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-tap-highlight-color:transparent;
  padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
}
main{max-width:640px;margin:0 auto;padding:16px 16px 40px}
h1{font-size:1.5rem;margin:8px 0 4px;letter-spacing:-.01em}
h2{font-size:1.1rem;margin:0 0 8px}
p{margin:0 0 12px}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin:12px 0}
button{font:inherit;color:inherit;cursor:pointer}
.btn{
  display:block;width:100%;min-height:52px;padding:12px 16px;margin:10px 0 0;
  border-radius:12px;border:1px solid var(--line);background:var(--card);text-align:left;
}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600;text-align:center}
.btn.ghost{background:transparent;text-align:center}
.btn:disabled{opacity:.5;cursor:default}
.opt:disabled{opacity:1}
.opt:disabled:not(.correct):not(.wrong){opacity:.6}
.btn .sub{display:block;font-size:.85rem;color:var(--muted);font-weight:400}
.btn.primary .sub{color:inherit;opacity:.85}
.row{display:flex;gap:10px}
.row .btn{flex:1}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:8px}
.linkbtn{background:none;border:0;padding:8px 0;color:var(--accent);font-weight:600}
.progress{height:6px;background:var(--line);border-radius:99px;overflow:hidden;margin:4px 0 14px}
.progress > div{height:100%;background:var(--accent);width:0;transition:width .25s}
.tag{display:inline-block;font-size:.8rem;font-weight:600;color:var(--accent);background:var(--accent-soft);padding:3px 9px;border-radius:99px;margin-bottom:10px}
.prompt{font-size:1.15rem;font-weight:600;margin:0 0 6px}
.opt{position:relative;padding-left:48px}
.opt .key{
  position:absolute;left:12px;top:50%;transform:translateY(-50%);
  width:26px;height:26px;border-radius:50%;border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;font-size:.8rem;font-weight:700;color:var(--muted)
}
.opt.correct{border-color:var(--ok);background:var(--ok-soft)}
.opt.correct .key{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .key{background:var(--bad);border-color:var(--bad);color:#fff}
.feedback{margin-top:14px;padding:14px;border-radius:12px;border:1px solid var(--line)}
.feedback.ok{border-color:var(--ok);background:var(--ok-soft)}
.feedback.bad{border-color:var(--bad);background:var(--bad-soft)}
.feedback b{display:block;margin-bottom:4px}
.src{font-size:.85rem;color:var(--muted);margin-top:6px}
.score{font-size:3rem;font-weight:800;line-height:1;margin:8px 0}
.list{list-style:none;padding:0;margin:0}
.list li{padding:10px 0;border-top:1px solid var(--line)}
.list li:first-child{border-top:0}
.topicgrid{display:grid;grid-template-columns:1fr;gap:0}
.topicgrid .btn{margin-top:8px;min-height:48px;padding:10px 14px}
.num{display:inline-block;min-width:28px;font-weight:700;color:var(--accent)}
footer{margin-top:28px;font-size:.8rem;color:var(--muted);text-align:center}
.hidden{display:none !important}
.qimg{display:block;margin:6px 0 10px}.qimg img{display:block;width:100%;max-height:62vh;object-fit:contain;border:1px solid #ddd;border-radius:10px;background:#fff}
</style>
</head>
<body>
<main id="app"><p class="muted">Loading…</p></main>
<script>
"use strict";
const STORE_KEY = "apq-state-v2";
const OLD_KEY = "apq1-state-v1";
let DATA = null;          // {title, quizzes:[{id,title,lectures,units,topics,questions}]}
let QZ = {};              // id -> quiz
let state = loadState();  // {missed:{id:q}, best:{key:n}, runs:{key:n}}
let run = null;           // current run
let ctx = null;           // current quiz id or "exam"

function loadState(){
  const blank = {missed:{}, best:{}, runs:{}};
  try{
    const s = JSON.parse(localStorage.getItem(STORE_KEY));
    if(s && typeof s==="object") return Object.assign(blank, s);
    const o = JSON.parse(localStorage.getItem(OLD_KEY));   // migrate Quiz #1 progress
    if(o && typeof o==="object"){
      for(const [k,q] of Object.entries(o.missed||{})){ q.quiz="q1"; blank.missed["q1:"+k]=Object.assign({},q,{id:"q1:"+k}); }
      if(o.best!==null && o.best!==undefined) blank.best["q1:practice"]=o.best;
      if(o.runs) blank.runs["q1:practice"]=o.runs;
    }
  }catch(e){}
  return blank;
}
function saveState(){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }catch(e){} }

const rand = n => Math.floor(Math.random()*n);
const pick = arr => arr[rand(arr.length)];
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=rand(i+1);[a[i],a[j]]=[a[j],a[i]];} return a; }
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const $ = id => document.getElementById(id);

/* ---------- Generated questions ---------- */
const ELEMENTS = [
  ["Carbon","C",6,12],["Nitrogen","N",7,14],["Oxygen","O",8,16],["Sodium","Na",11,23],
  ["Magnesium","Mg",12,24],["Aluminum","Al",13,27],["Phosphorus","P",15,31],["Sulfur","S",16,32],
  ["Chlorine","Cl",17,35],["Potassium","K",19,39],["Calcium","Ca",20,40],["Iron","Fe",26,56],
  ["Copper","Cu",29,64],["Iodine","I",53,127],["Helium","He",2,4],["Fluorine","F",9,19]
];
function numDistractors(correct, cands){
  const out = [];
  for(const c of cands){ if(c!==correct && c>0 && !out.includes(c)) out.push(c); if(out.length===3) break; }
  let k=1; while(out.length<3){ const c=correct+k*(k%2?1:-1)*Math.ceil(k/2); if(c>0 && c!==correct && !out.includes(c)) out.push(c); k++; }
  return out.map(String);
}
function genQ1T4(){
  const [name,sym,z,m] = pick(ELEMENTS); const n = m - z;
  const type = rand(4); const src = "L2, slides 11–12";
  const base = {quiz:"q1",topic:4,u:"L2",gen:true};
  if(type===0) return Object.assign(base,{q:`${name} (${sym}) has an atomic number of ${z} and an atomic mass of ${m}. How many neutrons does it have?`,
    a:String(n), w:numDistractors(n,[z,m,m+z,n+1]), e:`Neutrons = atomic mass − atomic number = ${m} − ${z} = ${n}.`, s:src});
  if(type===1) return Object.assign(base,{q:`An atom of ${name} has ${z} protons and ${n} neutrons. What is its atomic mass?`,
    a:String(m), w:numDistractors(m,[z,n,m+z,Math.abs(n-z)]), e:`Atomic mass = protons + neutrons = ${z} + ${n} = ${m}.`, s:src});
  if(type===2) return Object.assign(base,{q:`An atom of ${name} has ${z} protons and ${n} neutrons. What is its atomic number?`,
    a:String(z), w:numDistractors(z,[n,m,m+z,z+1]), e:`Atomic number = number of protons = ${z}.`, s:src});
  return Object.assign(base,{q:`${name} (${sym}) has an atomic number of ${z} and an atomic mass of ${m}. How many electrons does a neutral atom have?`,
    a:String(z), w:numDistractors(z,[n,m,m-z===z?m+1:m-z,z*2]), e:`In a neutral atom, electrons = protons = atomic number = ${z}.`, s:"L2, slides 12, 14"});
}
function genQ1T21(){
  const type = rand(3); const src = "L3, slide 11";
  const base = {quiz:"q1",topic:21,u:"L3",gen:true};
  if(type===0){
    const v = pick([0,1,2,3,4,5,6,6.5,7,7,7.5,8,9,10,11,12,13,14]);
    const a = v<7 ? "Acidic" : v===7 ? "Neutral" : "Basic";
    return Object.assign(base,{q:`A solution with a pH of ${v} is:`, a, w:["Acidic","Neutral","Basic","A buffer"].filter(x=>x!==a).slice(0,3),
      e:`pH 0 to below 7 = acidic, 7 = neutral, above 7 to 14 = basic.`, s:src});
  }
  const vals = shuffle([1,2,3,4,5,6,8,9,10,11,12,13]).slice(0,4);
  const acid = type===1, best = acid ? Math.min(...vals) : Math.max(...vals);
  return Object.assign(base,{q:`Which pH value is the MOST ${acid?"acidic":"basic"}?`, a:`pH ${best}`, w:vals.filter(x=>x!==best).map(x=>`pH ${x}`),
    e: acid ? `The lower the pH, the more acidic (more H⁺). pH ${best} is lowest.` : `The higher the pH, the more basic (more OH⁻). pH ${best} is highest.`, s:src});
}
/* Quiz #2 topic 5: DNA/RNA base pairing with random sequences */
const DNA_PAIR = {A:"T",T:"A",G:"C",C:"G"};
const RNA_FROM_DNA = {A:"U",T:"A",G:"C",C:"G"};
const RNA_PAIR = {A:"U",U:"A",G:"C",C:"G"};
const mapSeq = (s,m) => s.split("").map(c=>m[c]||c).join("");
const triplets = s => s.match(/.{1,3}/g).join("-");
function randDNA(n){ let s=""; for(let i=0;i<n;i++) s+="ATGC"[rand(4)]; return s; }
function uniqWrong(correct, cands){
  const out=[]; for(const c of cands){ if(c!==correct && !out.includes(c)) out.push(c); }
  while(out.length<3){ const c = correct.split("").reverse().join("")+"ATGC"[out.length]; if(!out.includes(c)&&c!==correct) out.push(c); }
  return out.slice(0,3);
}
function genQ2T5(){
  const base = {quiz:"q2",topic:5,u:"L4",gen:true};
  const type = rand(5);
  if(type===4){
    const codons = 2+rand(5), dna = randDNA(codons*3);
    const bonds = rand(2)===0;
    const mrna = mapSeq(dna,RNA_FROM_DNA);
    if(bonds) return Object.assign(base,{q:`An mRNA strand reads ${triplets(mrna)}. Counting each codon as one amino acid (as the lecture does), how many peptide bonds join them?`,
      a:String(codons-1), w:numDistractors(codons-1,[codons,codons*3,codons+1]), e:`${codons} codons = ${codons} amino acids. Peptide bonds = amino acids − 1 = ${codons-1}.`, s:"L4, slide 50"});
    return Object.assign(base,{q:`A DNA template strand has ${codons*3} bases: ${dna}. How many amino acids does it code for (as counted in the lecture)?`,
      a:String(codons), w:numDistractors(codons,[codons*3,codons-1,codons+1]), e:`DNA is read in triplets: ${codons*3} bases ÷ 3 = ${codons} amino acids.`, s:"L4, slides 48–50"});
  }
  const dna = randDNA(6+3*rand(3));
  if(type===0){
    const a = mapSeq(dna,DNA_PAIR);
    return Object.assign(base,{q:`What is the complementary DNA strand for ${dna}?`, a,
      w: uniqWrong(a,[mapSeq(dna,RNA_FROM_DNA), dna, mapSeq(dna,{A:"G",G:"A",T:"C",C:"T"}), a.split("").reverse().join("")]),
      e:`DNA pairing: A↔T and G↔C. ${dna} → ${a}.`, s:"L4, slides 33, 39"});
  }
  if(type===1){
    const a = mapSeq(dna,RNA_FROM_DNA);
    return Object.assign(base,{q:`A DNA template strand reads ${dna}. What mRNA is transcribed from it?`, a,
      w: uniqWrong(a,[mapSeq(dna,DNA_PAIR), dna.replace(/T/g,"U"), mapSeq(dna,{A:"G",G:"A",T:"C",C:"U"})]),
      e:`Transcription uses RNA rules: A→U, T→A, G→C, C→G. No T in RNA. ${dna} → ${a}.`, s:"L4, slides 47, 49"});
  }
  if(type===2){
    const mrna = mapSeq(dna,RNA_FROM_DNA), a = mapSeq(mrna,RNA_PAIR);
    return Object.assign(base,{q:`An mRNA strand reads ${mrna}. What are the matching tRNA anticodons?`, a,
      w: uniqWrong(a,[mapSeq(mrna,{A:"T",U:"A",G:"C",C:"G"}), mrna, dna]),
      e:`tRNA pairs with mRNA using RNA rules: A↔U, G↔C. ${mrna} → ${a}. (Same as the original DNA with U in place of T.)`, s:"L4, slides 48–49"});
  }
  const i = rand(dna.length), b = dna[i];
  const rna = rand(2)===0;
  const a = rna ? RNA_FROM_DNA[b] : DNA_PAIR[b];
  const all = rna ? ["A","U","G","C"] : ["A","T","G","C"];
  return Object.assign(base,{q: rna ? `During transcription, a DNA base ${b} is matched by which RNA base?` : `In a DNA double helix, which base pairs with ${b}?`,
    a, w: all.filter(x=>x!==a), e: rna ? `DNA → RNA: A→U, T→A, G→C, C→G.` : `DNA: A pairs with T; G pairs with C.`, s:"L4, slide 39"});
}
const GENERATORS = {"q1:4":genQ1T4, "q1:21":genQ1T21, "q2:5":genQ2T5};
const gen = (qz,t) => GENERATORS[qz+":"+t];

/* ---------- Question selection ---------- */
function byTopic(qz,t){ return QZ[qz].questions.filter(q=>q.topic===t); }
function topicNums(qz){ return Object.keys(QZ[qz].topics).map(Number).sort((a,b)=>a-b); }
function drawOne(qz, t, used){
  const pool = byTopic(qz,t).filter(q=>!used.has(q.id));
  const g = gen(qz,t);
  if(g && (pool.length===0 || Math.random()<0.5)) return g();
  return pick(pool.length?pool:byTopic(qz,t));
}
function prepare(q){
  const opts = shuffle([q.a, ...q.w]);
  return Object.assign({}, q, {opts, correct: opts.indexOf(q.a), id: q.id || ("g:"+q.quiz+":"+q.q)});
}
function buildPractice(qz){
  const used = new Set();
  return topicNums(qz).map(t=>{ const q=drawOne(qz,t,used); if(q.id) used.add(q.id); return prepare(q); });
}
function buildDrill(qz,t){
  let list = byTopic(qz,t).slice();
  const g = gen(qz,t);
  if(g){ const seen=new Set(); let tries=0; while(list.length<14 && tries<60){ const x=g(); if(!seen.has(x.q)){seen.add(x.q); list.push(x);} tries++; } }
  return shuffle(list).map(prepare);
}
function buildUnit(qz,u,n){
  const pool = shuffle(QZ[qz].questions.filter(q=>q.u===u));
  const genTopics = topicNums(qz).filter(t=>gen(qz,t) && QZ[qz].questions.some(q=>q.topic===t && q.u===u));
  const list = pool.slice(0,n);
  genTopics.forEach(t=>{ if(list.length) list[rand(list.length)] = gen(qz,t)(); });
  return list.sort((a,b)=>a.topic-b.topic).map(prepare);
}
function buildExamFull(){
  const out=[]; DATA.quizzes.forEach(z=>out.push(...buildPractice(z.id))); return out;
}
function buildExamMix(n){
  const slots = shuffle(DATA.quizzes.flatMap(z=>topicNums(z.id).map(t=>[z.id,t]))).slice(0,n);
  const order = DATA.quizzes.map(z=>z.id);
  slots.sort((a,b)=> order.indexOf(a[0])-order.indexOf(b[0]) || a[1]-b[1]);
  const used=new Set();
  return slots.map(([qz,t])=>{ const q=drawOne(qz,t,used); if(q.id) used.add(q.id); return prepare(q); });
}
function missedFor(scope){
  return Object.values(state.missed).filter(q=> scope==="exam" || q.quiz===scope);
}
function buildMissed(scope){
  const order = DATA.quizzes.map(z=>z.id);
  return missedFor(scope).sort((a,b)=> order.indexOf(a.quiz)-order.indexOf(b.quiz) || a.topic-b.topic).map(q=>prepare(q));
}

/* ---------- Screens ---------- */
const app = $("app");
function render(html){ app.innerHTML = html; window.scrollTo(0,0); }
function setHash(h){ if(location.hash!=="#"+h) history.replaceState(null,"","#"+h); }
const stat = key => (state.best[key]!==undefined ? `Best: <b>${state.best[key]}</b> · ` : "") + `Taken: <b>${state.runs[key]||0}</b>`;

function chooser(){
  ctx=null;
  history.replaceState(null,"",location.pathname);
  const totalTopics = DATA.quizzes.reduce((n,z)=>n+topicNums(z.id).length,0);
  const cards = DATA.quizzes.slice().reverse().map((z,i)=>`
    <button class="btn ${i===0?"primary":""}" data-q="${z.id}">${esc(z.title)}<span class="sub">${esc(z.lectures)}: ${esc(Object.values(z.units).join(", "))}</span></button>`).join("");
  render(`
    <h1>A&amp;P Practice</h1>
    <p class="muted">Pick a quiz. Every practice quiz is a new random set, one question per study-guide topic.</p>
    ${cards}
    <button class="btn" data-q="exam">Cumulative exam practice<span class="sub">Midterm / final review · ${DATA.quizzes.length} quizzes, ${totalTopics} topics</span></button>
    <footer>Unofficial study aid based on NYIM A&amp;P lectures. Progress is saved only on this device.<br>
      <button class="linkbtn small" id="reset">Reset my progress</button></footer>
  `);
  app.querySelectorAll("[data-q]").forEach(b=> b.onclick = ()=> b.dataset.q==="exam" ? examHome() : quizHome(b.dataset.q));
  $("reset").onclick = ()=>{ if(confirmReset()){ state={missed:{},best:{},runs:{}}; saveState(); chooser(); } };
}
let resetArmed=false;
function confirmReset(){
  const b=$("reset");
  if(!resetArmed){ resetArmed=true; b.textContent="Tap again to confirm reset"; setTimeout(()=>{resetArmed=false; if(b.isConnected) b.textContent="Reset my progress";},3000); return false; }
  resetArmed=false; return true;
}

function quizHome(qz){
  ctx=qz; setHash(qz);
  const z=QZ[qz], n=topicNums(qz).length, m=missedFor(qz).length;
  const gens = topicNums(qz).filter(t=>gen(qz,t)).map(t=>`#${t}`).join(", ");
  const units = Object.entries(z.units).map(([u,name])=>{
    const c = z.questions.filter(q=>q.u===u).length;
    return `<button class="btn" data-u="${u}"><span class="num">${u}</span> ${esc(name)}<span class="sub">${Math.min(20,c)} random questions from ${c}</span></button>`;
  }).join("");
  render(`
    <div class="topbar"><button class="linkbtn" id="back">‹ All quizzes</button></div>
    <h1>${esc(z.title)} Practice</h1>
    <p class="muted">${esc(z.lectures)}. One question per study-guide topic, in order (1 → ${n}).</p>
    <button class="btn primary" id="go">Start practice quiz<span class="sub">${n} questions · new random set every time</span></button>
    <h2 style="margin-top:22px">Practice by subject</h2>
    ${units}
    <h2 style="margin-top:22px">More</h2>
    <button class="btn" id="drill">Drill one topic<span class="sub">Every question for a single study-guide topic</span></button>
    <button class="btn" id="missed" ${m?"":"disabled"}>Review missed questions<span class="sub">${m?m+" saved to retry":"Nothing missed yet"}</span></button>
    <div class="card small muted">${stat(qz+":practice")}<br>
      Question bank: ${z.questions.length} questions${gens?` + generated questions for topic ${gens}`:""}.</div>
  `);
  $("back").onclick = chooser;
  $("go").onclick = ()=>start({mode:"practice", scope:qz}, buildPractice(qz));
  app.querySelectorAll("[data-u]").forEach(b=> b.onclick = ()=> start({mode:"unit", scope:qz, unit:b.dataset.u}, buildUnit(qz,b.dataset.u,20)));
  $("drill").onclick = ()=>topicPicker(qz);
  $("missed").onclick = ()=>start({mode:"missed", scope:qz}, buildMissed(qz));
}

function examHome(){
  ctx="exam"; setHash("exam");
  const total = DATA.quizzes.reduce((n,z)=>n+topicNums(z.id).length,0);
  const m = missedFor("exam").length;
  const subj = DATA.quizzes.flatMap(z=>Object.entries(z.units).map(([u,name])=>
    `<button class="btn" data-z="${z.id}" data-u="${u}"><span class="num">${u}</span> ${esc(name)}<span class="sub">${esc(z.title)}</span></button>`)).join("");
  render(`
    <div class="topbar"><button class="linkbtn" id="back">‹ All quizzes</button></div>
    <h1>Cumulative exam practice</h1>
    <p class="muted">For the midterm and final. Mixes every quiz so far: ${DATA.quizzes.map(z=>esc(z.title)).join(", ")}.</p>
    <button class="btn primary" id="full">Full cumulative<span class="sub">${total} questions · one per topic from every quiz</span></button>
    <button class="btn" id="mix">Quick mix<span class="sub">25 questions · random topics from all quizzes</span></button>
    <button class="btn" id="missed" ${m?"":"disabled"}>Review all missed<span class="sub">${m?m+" saved across all quizzes":"Nothing missed yet"}</span></button>
    <h2 style="margin-top:22px">Practice by subject</h2>
    ${subj}
    <div class="card small muted">Full: ${stat("exam:full")}<br>Quick mix: ${stat("exam:mix")}</div>
  `);
  $("back").onclick = chooser;
  $("full").onclick = ()=>start({mode:"full", scope:"exam"}, buildExamFull());
  $("mix").onclick = ()=>start({mode:"mix", scope:"exam"}, buildExamMix(25));
  $("missed").onclick = ()=>start({mode:"missed", scope:"exam"}, buildMissed("exam"));
  app.querySelectorAll("[data-u]").forEach(b=> b.onclick = ()=> start({mode:"unit", scope:"exam", quiz:b.dataset.z, unit:b.dataset.u}, buildUnit(b.dataset.z,b.dataset.u,20)));
}

function topicPicker(qz){
  const items = Object.entries(QZ[qz].topics).map(([n,name])=>
    `<button class="btn" data-t="${n}"><span class="num">${n}.</span> ${esc(name)}</button>`).join("");
  render(`
    <div class="topbar"><button class="linkbtn" id="back">‹ ${esc(QZ[qz].title)}</button></div>
    <h1>Drill one topic</h1>
    <p class="muted">Pick a topic number from your study guide.</p>
    <div class="topicgrid">${items}</div>
  `);
  $("back").onclick = ()=>quizHome(qz);
  app.querySelectorAll("[data-t]").forEach(b=> b.onclick = ()=> start({mode:"drill", scope:qz, topic:+b.dataset.t}, buildDrill(qz,+b.dataset.t)));
}

function goBack(){ if(ctx==="exam") examHome(); else if(ctx) quizHome(ctx); else chooser(); }

function start(opts, list){
  if(!list.length){ goBack(); return; }
  run = Object.assign({list, i:0, score:0, answered:false, wrong:[]}, opts);
  question();
}

function question(){
  const q = run.list[run.i];
  const pct = Math.round((run.i)/run.list.length*100);
  const keys = "ABCD";
  const tagQuiz = run.scope==="exam" || run.mode==="missed" ? `${esc(QZ[q.quiz].title.replace("A&P ",""))} · ` : "";
  render(`
    <div class="topbar">
      <button class="linkbtn" id="quit">‹ Quit</button>
      <span class="small muted">Question ${run.i+1} of ${run.list.length} · Score ${run.score}</span>
    </div>
    <div class="progress"><div style="width:${pct}%"></div></div>
    <span class="tag">${tagQuiz}Topic ${q.topic} · ${esc(QZ[q.quiz].topics[q.topic])}</span>
    <p class="prompt">${esc(q.q)}</p>
    ${q.img?`<a href="${esc(q.img)}" target="_blank" class="qimg"><img src="${esc(q.img)}" alt="Handout diagram"></a><div class="small muted" style="text-align:center;margin:-4px 0 8px">Tap the diagram to open it full size and zoom.</div>`:""}
    <div id="opts">${q.opts.map((o,i)=>`<button class="btn opt" data-i="${i}"><span class="key">${keys[i]}</span>${esc(o)}</button>`).join("")}</div>
    <div id="fb"></div>
  `);
  $("quit").onclick = ()=>{ run=null; goBack(); };
  run.answered=false;
  app.querySelectorAll(".opt").forEach(b=> b.onclick = ()=> answer(+b.dataset.i));
}

function answer(i){
  if(run.answered) return; run.answered=true;
  const q = run.list[run.i];
  const ok = i===q.correct;
  app.querySelectorAll(".opt").forEach((b,j)=>{ b.disabled=true; if(j===q.correct) b.classList.add("correct"); else if(j===i) b.classList.add("wrong"); });
  const saved = {quiz:q.quiz,topic:q.topic,u:q.u,q:q.q,a:q.a,w:q.w,e:q.e,s:q.s,id:q.id,img:q.img};
  if(ok){ run.score++; delete state.missed[q.id]; }
  else { run.wrong.push(q); state.missed[q.id]=saved; }
  saveState();
  const last = run.i===run.list.length-1;
  $("fb").innerHTML = `
    <div class="feedback ${ok?"ok":"bad"}">
      <b>${ok?"Correct!":"Not quite. Answer: "+esc(q.a)}</b>
      ${esc(q.e)}
      <div class="src">Source: ${esc(QZ[q.quiz].title)} · ${esc(q.s)}</div>
    </div>
    <button class="btn primary" id="next">${last?"See results":"Next question"}</button>`;
  $("next").onclick = ()=>{ if(last) results(); else { run.i++; question(); } };
  $("next").scrollIntoView({behavior:"smooth",block:"nearest"});
}

function rebuild(r){
  if(r.mode==="practice") return buildPractice(r.scope);
  if(r.mode==="unit") return buildUnit(r.quiz||r.scope, r.unit, 20);
  if(r.mode==="drill") return buildDrill(r.scope, r.topic);
  if(r.mode==="full") return buildExamFull();
  if(r.mode==="mix") return buildExamMix(25);
  return buildMissed(r.scope);
}

function results(){
  const total = run.list.length, s = run.score;
  const key = run.scope==="exam" ? (run.mode==="full"||run.mode==="mix" ? "exam:"+run.mode : null) : (run.mode==="practice" ? run.scope+":practice" : null);
  if(key){ state.runs[key]=(state.runs[key]||0)+1; if(state.best[key]===undefined || s>state.best[key]) state.best[key]=s; saveState(); }
  const pct = Math.round(s/total*100);
  const msg = pct>=90?"Excellent, you're ready.":pct>=75?"Solid. Review the misses below.":pct>=60?"Getting there. Drill the topics you missed.":"Keep going. Drill topic by topic.";
  const missedList = run.wrong.map(q=>`<li><span class="num">${q.topic}.</span> ${esc(q.q)}<br><span class="small">Answer: <b>${esc(q.a)}</b> · <span class="muted">${esc(QZ[q.quiz].title)}, ${esc(q.s)}</span></span></li>`).join("");
  const again = {practice:"New random quiz", unit:"New subject set", drill:"Drill again", full:"New cumulative set", mix:"New quick mix", missed:"Go again"}[run.mode];
  render(`
    <h1>Results</h1>
    <div class="card" style="text-align:center">
      <div class="score">${s}/${total}</div>
      <div class="muted">${pct}% · ${msg}</div>
    </div>
    <button class="btn primary" id="again">${again}</button>
    ${run.wrong.length?`<button class="btn" id="retry">Retry the ${run.wrong.length} I missed</button>`:""}
    <button class="btn ghost" id="home">Back</button>
    ${run.wrong.length?`<div class="card"><h2>Missed questions</h2><ul class="list">${missedList}</ul></div>`:""}
  `);
  const r = Object.assign({}, run), wrong = run.wrong.slice();
  $("again").onclick = ()=> start(Object.assign({}, r, {list:undefined}), rebuild(r));
  if(wrong.length) $("retry").onclick = ()=> start({mode:"missed", scope:r.scope}, shuffle(wrong).map(q=>prepare(q)));
  $("home").onclick = goBack;
}

/* ---------- Boot ---------- */
function route(){
  const h = location.hash.replace("#","");
  if(h==="exam") examHome(); else if(QZ[h]) quizHome(h); else chooser();
}
fetch("questions.json", {cache:"no-cache"})
  .then(r=>{ if(!r.ok) throw new Error(r.status); return r.json(); })
  .then(data=>{
    data.quizzes.forEach(z=>{
      z.questions.forEach((q,i)=>{ q.quiz = z.id; q.id = z.id+":q"+i+":"+q.q.slice(0,40); });
      QZ[z.id] = z;
    });
    DATA = data; route();
  })
  .catch(()=>{ app.innerHTML = '<div class="card">Could not load the questions. Check your connection and refresh.</div>'; });

if("serviceWorker" in navigator && location.protocol==="https:"){
  navigator.serviceWorker.register("sw.js").catch(()=>{});
}
</script>
</body>
</html>
