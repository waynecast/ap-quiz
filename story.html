<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>A&amp;P Story Mode</title>
<meta name="description" content="Narrated A&P review stories that connect terms across lectures.">
<meta name="theme-color" content="#0f766e">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
:root{
  --bg:#f6f7f5; --card:#ffffff; --ink:#1c2321; --muted:#5f6b67; --line:#dfe4e1;
  --accent:#0f766e; --accent-ink:#ffffff; --accent-soft:#e3f2ef; --hi:#fff3c4; --hi-ink:#5b4300;
  --radius:14px;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#111615; --card:#1a2120; --ink:#e8eeec; --muted:#9aa7a3; --line:#2c3633;
    --accent:#2dd4bf; --accent-ink:#06201d; --accent-soft:#163430; --hi:#3d3410; --hi-ink:#ffe7a3;
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--bg); color:var(--ink);
  font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-tap-highlight-color:transparent;
  padding:env(safe-area-inset-top) 0 0;
}
main{max-width:640px;margin:0 auto;padding:12px 16px 150px}
h1{font-size:1.5rem;margin:8px 0 4px;letter-spacing:-.01em}
p{margin:0 0 12px}
h2{font-size:1.1rem;margin:26px 0 2px}
.muted{color:var(--muted)}
.small{font-size:.85rem}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--accent)}
.linkbtn{background:none;border:0;padding:8px 0;color:var(--accent);font-weight:600;text-decoration:none;display:inline-block}
.btn{display:block;width:100%;min-height:52px;padding:12px 16px;margin:10px 0 0;border-radius:12px;border:1px solid var(--line);background:var(--card);text-align:left}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.btn .sub{display:block;font-size:.85rem;color:var(--muted);font-weight:400}
.btn.primary .sub{color:inherit;opacity:.85}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px}

/* scene progress: one segment per scene */
.segs{display:flex;gap:3px;margin:6px 0 14px}
.segs button{flex:1;height:7px;border:0;padding:0;border-radius:99px;background:var(--line);position:relative;overflow:hidden}
.segs button.done{background:var(--accent)}
.segs button i{position:absolute;inset:0;width:0;background:var(--accent)}

.tag{display:inline-block;font-size:.8rem;font-weight:600;color:var(--accent);background:var(--accent-soft);padding:3px 10px;border-radius:99px}
.title{font-size:1.35rem;font-weight:750;letter-spacing:-.01em;margin:8px 0 10px;line-height:1.2;border-radius:10px;padding:2px 8px;margin-left:-8px;margin-right:-8px;transition:background .25s}
.title.now{background:var(--accent-soft)}
.visual{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;margin-bottom:12px}
.visual img{display:block;width:100%;max-height:34vh;object-fit:contain;background:#fff;cursor:zoom-in}
.visual.words{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center;padding:22px 14px;min-height:120px}
.visual.words span{font-size:1.25rem;font-weight:700;padding:6px 12px;border-radius:10px;border:2px solid var(--line);transition:all .25s}
.visual.words span.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.terms{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}
.terms span{font-size:.85rem;font-weight:600;padding:4px 10px;border-radius:99px;border:1px solid var(--line);background:var(--card);transition:all .25s}
.terms span.on{border-color:var(--accent);background:var(--accent);color:var(--accent-ink)}
.lines{list-style:none;margin:0;padding:0}
.lines li{font-size:1.12rem;line-height:1.45;padding:7px 10px;margin:0 -10px;border-radius:10px;color:var(--muted);opacity:.55;transition:all .25s;cursor:pointer}
.lines li.past{opacity:1;color:var(--ink)}
.lines li.now{opacity:1;color:var(--ink);background:var(--accent-soft);font-weight:600}
.lines li b{color:var(--accent);font-weight:750}
.lines li.now b{color:var(--accent)}

/* control bar */
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom))}
.bar .in{max-width:640px;margin:0 auto}
.scrub{display:flex;align-items:center;gap:10px;font-size:.78rem;color:var(--muted);font-variant-numeric:tabular-nums}
.scrub input{flex:1;accent-color:var(--accent)}
.ctrls{display:flex;align-items:center;justify-content:space-between;margin-top:6px}
.ic{width:52px;height:52px;border-radius:50%;border:0;background:none;display:flex;align-items:center;justify-content:center}
.ic svg{width:26px;height:26px;fill:var(--ink)}
.play{width:64px;height:64px;background:var(--accent)}
.play svg{fill:var(--accent-ink);width:30px;height:30px}
.pill{min-width:58px;height:36px;border-radius:99px;border:1px solid var(--line);background:none;font-weight:700;font-size:.9rem}

/* zoomed image */
.zoom{position:fixed;inset:0;background:rgba(0,0,0,.92);display:none;z-index:10;overflow:auto;touch-action:pinch-zoom}
.zoom.show{display:block}
.zoom img{display:block;width:100%;min-height:100%;object-fit:contain;background:#fff}
.zoom button{position:fixed;top:calc(10px + env(safe-area-inset-top));right:12px;background:rgba(0,0,0,.6);color:#fff;border:0;border-radius:99px;padding:8px 14px;font-weight:700}
footer{margin-top:28px;font-size:.8rem;color:var(--muted)}
</style>
</head>
<body>
<main id="app"></main>
<div class="zoom" id="zoom"><button id="zclose">Close ✕</button><img alt=""></div>
<audio id="aud" preload="auto"></audio>
<script>
const $ = id => document.getElementById(id);
const app = $("app"), aud = $("aud");
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const md = s => esc(s).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>");
const fmt = t => { t = Math.max(0, Math.floor(t)); return Math.floor(t/60) + ":" + String(t%60).padStart(2,"0"); };
const store = {
  get(k){ try { return JSON.parse(localStorage.getItem("apq-story:"+k)); } catch(e){ return null; } },
  set(k,v){ try { localStorage.setItem("apq-story:"+k, JSON.stringify(v)); } catch(e){} }
};
const ICON = {
  play:'<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>',
  pause:'<svg viewBox="0 0 24 24"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>',
  prev:'<svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zM9.5 12l8.5 6V6z"/></svg>',
  next:'<svg viewBox="0 0 24 24"><path d="M16 6h2v12h-2zM6 18l8.5-6L6 6z"/></svg>',
  back:'<svg viewBox="0 0 24 24"><path d="M12 5V1L7 6l5 5V7a6 6 0 1 1-6 6H4a8 8 0 1 0 8-8z"/></svg>'
};
const SPEEDS = [0.85, 1, 1.15, 1.3, 1.5];

let S = null, LIST = null, sceneIdx = -1, lineIdx = -1;

async function home(){
  aud.pause();
  history.replaceState(null, "", location.pathname);
  const list = LIST = await fetch("stories/index.json").then(r => r.json());
  const row = (s, primary) => {
    const pos = store.get(s.id);
    const resume = pos && pos.t > 5 ? ` · resume at ${fmt(pos.t)}` : "";
    return `<button class="btn ${primary?"primary":""}" data-s="${esc(s.id)}">${esc(s.title)}<span class="sub">${esc(s.subtitle)} · ${fmt(s.duration)}${resume}</span></button>`;
  };
  const threads = list.filter(s => s.group === "thread"), lectures = list.filter(s => s.group !== "thread");
  const total = list.reduce((n, s) => n + s.duration, 0);
  app.innerHTML = `
    <div class="topbar"><a class="linkbtn" href="./">‹ Quizzes</a></div>
    <h1>Story Mode</h1>
    <p class="muted">Listen and follow along. Narrated stories with the picture and key words on screen. ${list.length} stories, about ${Math.round(total/60)} minutes in all.</p>
    ${threads.length ? `<h2>Connections</h2><p class="small muted">Follow one idea across many lectures.</p>${threads.map((s,i) => row(s, i===0)).join("")}` : ""}
    ${lectures.length ? `<h2>Lecture by lecture</h2><p class="small muted">One story per lecture. Each plays straight into the next, so you can listen to all of them in a row.</p>${lectures.map(s => row(s, false)).join("")}` : ""}
    <footer>Unofficial study aid based on NYIM A&amp;P lectures. Tip: it keeps playing with your screen locked.</footer>`;
  app.querySelectorAll("[data-s]").forEach(b => b.onclick = () => open(b.dataset.s));
}

async function open(id, autoplay){
  if (!LIST) { try { LIST = await fetch("stories/index.json").then(r => r.json()); } catch(e) { LIST = []; } }
  S = await fetch(`stories/${id}.json`).then(r => r.json());
  history.replaceState(null, "", "#" + id);
  sceneIdx = -1; lineIdx = -1;
  app.innerHTML = `
    <div class="topbar"><button class="linkbtn" id="back">‹ Stories</button><span class="small muted" id="count"></span></div>
    <div class="segs" id="segs">${S.scenes.map((_,i) => `<button aria-label="Scene ${i+1}" data-i="${i}"><i></i></button>`).join("")}</div>
    <div id="scene"></div>
    <div class="bar"><div class="in">
      <div class="scrub"><span id="cur">0:00</span><input type="range" id="seek" min="0" max="${S.duration}" step="0.1" value="0"><span>${fmt(S.duration)}</span></div>
      <div class="ctrls">
        <button class="pill" id="speed">1×</button>
        <button class="ic" id="prev" aria-label="Previous scene">${ICON.prev}</button>
        <button class="ic play" id="pp" aria-label="Play">${ICON.play}</button>
        <button class="ic" id="next" aria-label="Next scene">${ICON.next}</button>
        <button class="pill" id="rew" aria-label="Back 10 seconds">−10s</button>
      </div>
    </div></div>`;
  $("back").onclick = () => { savePos(); home(); };
  $("segs").querySelectorAll("button").forEach(b => b.onclick = () => jump(S.scenes[+b.dataset.i].start));
  $("pp").onclick = () => aud.paused ? aud.play() : aud.pause();
  $("prev").onclick = prevScene;
  $("next").onclick = nextScene;
  $("rew").onclick = () => jump(now() - 10);
  const sp = store.get("speed") || 1;
  aud.playbackRate = sp; $("speed").textContent = sp + "×";
  $("speed").onclick = () => {
    const n = SPEEDS[(SPEEDS.indexOf(aud.playbackRate) + 1) % SPEEDS.length] || 1;
    aud.playbackRate = n; $("speed").textContent = n + "×"; store.set("speed", n);
  };
  const seek = $("seek");
  seek.oninput = () => { $("cur").textContent = fmt(+seek.value); sync(+seek.value); };
  seek.onchange = () => jump(+seek.value);
  aud.src = S.audio;
  const pos = store.get(id);
  const startAt = pos && pos.t < S.duration - 3 ? pos.t : 0;
  pendingT = startAt;
  aud.addEventListener("loadedmetadata", () => { if (pendingT != null) { aud.currentTime = pendingT; pendingT = null; } }, {once:true});
  sync(startAt);
  setupMediaSession();
  if (autoplay) aud.play().catch(() => {});
}

let pendingT = null;
function jump(t){
  t = Math.min(Math.max(0, t), S.duration - 0.05);
  if (aud.readyState < 1) pendingT = t; else aud.currentTime = t;
  sync(t);
}
const now = () => pendingT != null ? pendingT : aud.currentTime;
function prevScene(){
  const sc = S.scenes[sceneIdx];
  // within the first 2 s of a scene, go to the previous one; otherwise restart this one
  const target = (now() - sc.start < 2 && sceneIdx > 0) ? S.scenes[sceneIdx-1].start : sc.start;
  jump(target);
}
function nextScene(){ if (sceneIdx < S.scenes.length - 1) jump(S.scenes[sceneIdx+1].start); }

function findScene(t){
  let i = 0; while (i < S.scenes.length - 1 && t >= S.scenes[i+1].start) i++; return i;
}
function findLine(sc, t){
  let j = -1; sc.lines.forEach((l,k) => { if (t >= l.start - 0.05) j = k; }); return j;
}

function drawScene(i){
  const sc = S.scenes[i];
  const visual = sc.img
    ? `<div class="visual"><img src="img/story/${esc(sc.img)}" alt="${esc(sc.title)}" id="pic"></div>`
    : `<div class="visual words">${sc.terms.map(t => `<span>${esc(t)}</span>`).join("")}</div>`;
  $("scene").innerHTML = `
    <span class="tag">${esc(sc.lec)}</span>
    <div class="title">${esc(sc.title)}</div>
    ${visual}
    ${sc.img ? `<div class="terms">${sc.terms.map(t => `<span>${esc(t)}</span>`).join("")}</div>` : ""}
    <ul class="lines">${sc.lines.map((l,k) => `<li data-k="${k}">${md(l.text)}</li>`).join("")}</ul>`;
  $("scene").querySelectorAll("li").forEach(li => li.onclick = () => jump(sc.lines[+li.dataset.k].start));
  const pic = $("pic");
  if (pic) pic.onclick = () => { $("zoom").querySelector("img").src = pic.src; $("zoom").classList.add("show"); };
  $("count").textContent = `Scene ${i+1} of ${S.scenes.length}`;
  if ("mediaSession" in navigator) {
    navigator.mediaSession.metadata = new MediaMetadata({
      title: sc.title, artist: S.title, album: "A&P Story Mode",
      artwork: [{src:"icon-512.png", sizes:"512x512", type:"image/png"}]
    });
  }
}

// normalise a term for matching against spoken text
const norm = s => s.toLowerCase().replace(/[²⁺]/g, "").replace(/[^a-z0-9 ]/g, " ").trim();
function highlightTerms(sc, j){
  const spoken = j >= 0 ? sc.lines.slice(0, j+1).map(l => norm(l.text.replace(/\*\*/g,""))).join(" ") : "";
  const chips = $("scene").querySelectorAll(".terms span, .visual.words span");
  chips.forEach((c, n) => {
    const words = norm(sc.terms[n]).split(/\s+/).filter(w => w.length > 1);
    c.classList.toggle("on", words.length > 0 && words.some(w => spoken.includes(w)));
  });
}

function sync(t){
  if (!S) return;
  const i = findScene(t);
  if (i !== sceneIdx) { sceneIdx = i; lineIdx = -2; drawScene(i); }
  const sc = S.scenes[i];
  const j = findLine(sc, t);
  const tEl = $("scene").querySelector(".title");
  if (tEl) tEl.classList.toggle("now", sc.tstart != null && t >= sc.tstart - 0.05 && t < sc.tend + 0.3);
  if (j !== lineIdx) {
    lineIdx = j;
    $("scene").querySelectorAll("li").forEach((li,k) => {
      li.className = k < j ? "past" : k === j ? "now" : "";
    });
    highlightTerms(sc, j);
    const cur = $("scene").querySelector("li.now");
    if (cur) {
      const r = cur.getBoundingClientRect(), barTop = document.querySelector(".bar").getBoundingClientRect().top;
      if (r.bottom > barTop - 10 || r.top < 0) cur.scrollIntoView({behavior:"smooth", block:"center"});
    } else if (j < 0) window.scrollTo({top:0, behavior:"smooth"});
  }
  document.querySelectorAll("#segs button").forEach((b,k) => {
    const s = S.scenes[k];
    b.querySelector("i").style.width = k < i ? "100%" : k > i ? "0" : Math.min(100, (t - s.start) / (s.end - s.start) * 100) + "%";
  });
  $("cur").textContent = fmt(t);
  const seek = $("seek"); if (document.activeElement !== seek) seek.value = t;
}

let lastSave = 0;
function savePos(){ if (S) store.set(S.id, {t: now()}); }
aud.addEventListener("timeupdate", () => {
  if (aud.seeking || pendingT != null) return;
  sync(aud.currentTime);
  if (Date.now() - lastSave > 3000) { lastSave = Date.now(); savePos(); }
});
aud.addEventListener("play", () => { $("pp").innerHTML = ICON.pause; $("pp").setAttribute("aria-label","Pause"); });
aud.addEventListener("pause", () => { if ($("pp")) { $("pp").innerHTML = ICON.play; $("pp").setAttribute("aria-label","Play"); } savePos(); });
aud.addEventListener("ended", () => {
  if (!S) return;
  store.set(S.id, {t: 0});
  // continue into the next story in the same group
  const same = (LIST || []).filter(s => s.group === S.group);
  const k = same.findIndex(s => s.id === S.id);
  if (k >= 0 && k < same.length - 1) { store.set(same[k+1].id, {t: 0}); open(same[k+1].id, true); }
});

function setupMediaSession(){
  if (!("mediaSession" in navigator)) return;
  const ms = navigator.mediaSession;
  const set = (a, f) => { try { ms.setActionHandler(a, f); } catch(e){} };
  set("play", () => aud.play());
  set("pause", () => aud.pause());
  set("previoustrack", prevScene);
  set("nexttrack", nextScene);
  set("seekbackward", d => jump(aud.currentTime - ((d && d.seekOffset) || 10)));
  set("seekforward", d => jump(aud.currentTime + ((d && d.seekOffset) || 10)));
  set("seekto", d => jump(d.seekTime));
}

$("zclose").onclick = () => $("zoom").classList.remove("show");
document.addEventListener("keydown", e => {
  if (!S || !$("pp")) return;
  if (e.code === "Space") { e.preventDefault(); $("pp").click(); }
  if (e.key === "ArrowRight") nextScene();
  if (e.key === "ArrowLeft") prevScene();
});

const h = location.hash.slice(1);
h ? open(h).catch(home) : home();
</script>
</body>
</html>
